<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime League group stats</title>
<style>
:root{--bg:#f3f4f8;--panel:#fff;--panel2:#eceef4;--text:#14161c;--muted:#667085;--line:#dde1ea;--accent:#6857e8;--pos:#15803d;--neg:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f15;--panel:#151821;--panel2:#1d212c;--text:#e9ebf1;--muted:#8b92a5;--line:#252a37;--accent:#8c7dff;--pos:#34d399;--neg:#f87171}}
:root[data-theme="dark"]{--bg:#0d0f15;--panel:#151821;--panel2:#1d212c;--text:#e9ebf1;--muted:#8b92a5;--line:#252a37;--accent:#8c7dff;--pos:#34d399;--neg:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
button,.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:focus-visible,.btn:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
#drop{padding:56px 20px;text-align:center;border-style:dashed}
#drop h2{margin:0 0 6px;font-size:18px}
#drop p{margin:0 0 16px;color:var(--muted)}
#err{color:var(--neg);margin-top:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 14px;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.card{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card small{color:var(--muted);font-weight:600}
.card b{display:block;font-size:26px;line-height:1.15;margin:4px 0 2px}
.card span.n{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th.s{color:var(--text)}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
.rk{color:var(--muted);width:40px}
.ch{display:flex;align-items:center;gap:10px;font-weight:600}
.av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:hsl(var(--h) 55% 42%);flex:none}
img.av{object-fit:cover;background:none}
td.b{font-weight:700}
td.wr{position:relative}
td.wr i{position:absolute;left:12px;right:12px;bottom:5px;height:2px;background:var(--line)}
td.wr i u{display:block;height:100%;background:currentColor}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.mut{color:var(--muted)}
.menu{position:relative;margin-left:auto}.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:210px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.pop label{display:flex;gap:8px;align-items:center;padding:4px 2px;cursor:pointer}.pop hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.clk{cursor:pointer}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 14px 24px;overflow:auto}
.md{position:relative;width:100%;max-width:min(1560px,100%);padding:20px}
.md h2{margin:0 36px 12px 0;font-size:18px}.md h2 small{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:8px}
.x{position:absolute;right:12px;top:12px;padding:2px 10px;font-size:20px;line-height:1.2}
.mg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.mg{grid-template-columns:1fr}}
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sum div{background:var(--panel2);padding:8px 10px}.sum small{display:block;color:var(--muted);font-size:11.5px}.sum b{font-size:15px}
.pt{min-width:0}.pt th{position:static;cursor:default}
.ics{display:flex;gap:4px;justify-content:center}
.av.sm{width:26px;height:26px;border-radius:6px;font-size:9px}
.gl{display:flex;flex-direction:column;gap:8px}
.gm{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--neg);border-radius:10px;background:var(--panel2)}
.gm.w{border-left-color:var(--pos)}
.gm .side{display:flex;flex-direction:column;gap:4px;min-width:0}.gm .side:last-child{align-items:flex-end;text-align:right}
.gm .ic{display:flex;gap:3px}.gm .mid{text-align:center;display:flex;flex-direction:column;line-height:1.3}
.gm .mid small,.res{color:var(--muted);font-size:11.5px}
.lnk{cursor:pointer}.lnk:hover{text-decoration:underline}
.hide{display:none}

.aka{display:block;color:var(--muted);font-size:11px;font-weight:400;white-space:normal;line-height:1.3}
/* team modal: roomier table, no horizontal scrollbar in most cases, nicer scrollbar when needed */
.pt th,.pt td{padding:9px 8px}.pt th:first-child,.pt td:first-child{padding-left:14px}
.pt td.l{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tw{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tw::-webkit-scrollbar{height:8px}.tw::-webkit-scrollbar-track{background:transparent}
.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}.tw::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@media (max-width:560px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Prime League group stats</h1><div class="sub" id="sub">Your last export loads automatically. You can also import an Excel file.</div></div>
  <div><input type="file" id="file" accept=".xlsx,.xls" hidden><button class="btn primary" id="pick">Import Excel</button></div>
</header>
<div id="drop" class="panel">
  <h2>Drop your Excel file here</h2>
  <p>Or open a group page, click the extension icon and export: the data appears here by itself. Files are read locally and never uploaded.</p>
  <button class="btn primary" id="pick2">Choose file</button>
  <div id="err"></div>
</div>
<div id="app" class="hide">
  <div class="tabs" id="tabs"><button data-v="champ" class="on">Champions</button><button data-v="team">Teams</button></div>
  <div class="cards" id="cards"></div>
  <div class="bar">
    <div class="seg" id="side"><button data-s="All" class="on">Overall</button><button data-s="Blue">Blue side</button><button data-s="Red">Red side</button></div>
    <div class="seg" id="role"><button data-r="All" class="on">All roles</button><button data-r="Top">Top</button><button data-r="Jungle">Jungle</button><button data-r="Mid">Mid</button><button data-r="Bot">Bot</button><button data-r="Support">Support</button></div>
    <div class="menu"><button id="cb">Columns ▾</button><div id="cm" class="pop hide"></div></div>
  </div>
  <div class="panel tw"><table id="t"></table></div>
</div>
</div>
<div id="ov" class="ov hide"></div>
<script src="xlsx.full.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
